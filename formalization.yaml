version: "v0.4"

project:
  name: "Eventual affine trace residue in shifted numerical semigroups"
  description: "For integers k ≥ 2, offsets 0 = r_0 < r_1 < ... < r_k = w with d = gcd(r_1, ..., r_k), and n > 0 with gcd(n, d) = 1, let H_λ be the numerical semigroup generated by n + λw + r_i (0 ≤ i ≤ k). With PF(H) the pseudo-Frobenius numbers, tr(H) = {h ∈ H : ∃ p ∈ PF(H), ∀ f ∈ PF(H), h + p - f ∈ H} and res(H) = |H \\ tr(H)|, the record states that there are integers A ≥ 0, B and L ≥ 0 with res(H_λ) = Aλ + B for every integer λ ≥ L (PROOF.md §7 Theorem)."
  authors:
    - "benkeene"
  license: "Apache-2.0"
  responsible_maintainers:
    - "benkeene"

repository:
  role: substantive-development

classification:
  arxiv: ["math.AC", "math.CO"]
  msc2020: ["20M14", "13H10"]

status:
  scope: "One statement of record, trace_residue_eventually_affine, rendering the Theorem of PROOF.md §7 (the affirmative answer to CLAIM.md): existence of integers A ≥ 0, B, L ≥ 0 with res(H_λ) = Aλ + B for all integers λ ≥ L. Not formalized: the explicit slope A = d(|𝔄| + |𝔅|) and explicit threshold L of PROOF.md §7; the remarks of PROOF.md §8 (k ≥ 1 suffices, eventual quasi-polynomiality with period dividing w/d, eventual pseudo-Frobenius set and type, eventual constancy of nearly Gorenstein, the profile-count extension and its counterexample, nonemptiness of Φ_P); the intermediate lemmas (lattice model, pseudo-Frobenius description) as separate statements."
  sorry_count: 1
  sorry_in_definitions: 0
  axioms: ["Classical.choice", "Quot.sound", "propext"]
  main_results:
    - "EventualAffineTraceResidue.trace_residue_eventually_affine"

fidelity:
  divergences: "None in mathematical content: the record has exactly the hypotheses and the conclusion of CLAIM.md (in particular it keeps k ≥ 2, although PROOF.md §8 Remark 1 notes that k ≥ 1 suffices). Modelling conventions, none of which changes the statement: (1) H_λ is the additive submonoid of ℤ generated by the n + λw + r_i; for λ ≥ 0 these generators are positive and it is the informal numerical semigroup. (2) Pseudo-Frobenius numbers are non-elements in ℤ, as in PROOF.md §1; for H ≠ ℕ this agrees with the ℕ convention. (3) res is Set.encard in ℕ∞, and the conclusion asserts it is a natural number N with N = Aλ + B in ℤ, i.e. that H_λ \\ tr(H_λ) is finite with that cardinality (implicit in CLAIM.md, where |H \\ tr(H)| is compared with an integer). (4) d is the nonnegative gcd Finset.gcd of r_1, ..., r_k in ℤ, and the offsets are indexed by Fin (k + 1)."

