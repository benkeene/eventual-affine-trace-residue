alignment:
  namespace: "EventualAffineTraceResidue"
  statements:
    - source: "Eventual affine trace residue (PROOF.md §7, Theorem; answers CLAIM.md affirmatively). Let k ≥ 2 and let r : Fin (k + 1) → ℤ be offsets 0 = r_0 < r_1 < ... < r_k = w (hypotheses `r 0 = 0`, `StrictMono r`, `r (Fin.last k) = w`). Let d = gcd(r_1, ..., r_k), written `Finset.univ.gcd fun i : Fin k => r i.succ` (the nonnegative gcd in ℤ), and let n > 0 be an integer with gcd(n, d) = 1. For an integer λ let H_λ = `shiftedSemigroup k r n w λ`, the submonoid of ℤ generated by n + λw + r_i for 0 ≤ i ≤ k. Then there are integers A ≥ 0, B and L ≥ 0 such that for every integer λ ≥ L the trace residue res(H_λ) = |H_λ \\ tr(H_λ)| (`traceResidue`, an extended natural number) is a finite number N with N = Aλ + B. [PROOF.md §7 Theorem]"
      lean: "EventualAffineTraceResidue.trace_residue_eventually_affine"
