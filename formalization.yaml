version: "v0.4"

project:
  name: "Eventual affine trace residue in shifted numerical semigroups"
  description: "For integers k ≥ 2, offsets 0 = r_0 < r_1 < ... < r_k = w with d = gcd(r_1, ..., r_k), and n > 0 with gcd(n, d) = 1, let H_λ be the numerical semigroup generated by n + λw + r_i (0 ≤ i ≤ k). With PF(H) the pseudo-Frobenius numbers, tr(H) = {h ∈ H : ∃ p ∈ PF(H), ∀ f ∈ PF(H), h + p - f ∈ H} and res(H) = |H \\ tr(H)|, the record states that there are integers A ≥ 0, B and L ≥ 0 with res(H_λ) = Aλ + B for every integer λ ≥ L (PROOF.md §7 Theorem)."
  authors:
    - "benkeene"
  license: "Apache-2.0"
  responsible_maintainers:
    - "benkeene"

