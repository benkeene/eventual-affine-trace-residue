schema: conductor/records/1
project:
  name: "Eventual affine trace residue in shifted numerical semigroups"
  slug: eventual-affine-trace-residue
  library: EventualAffineTraceResidue
  namespace: EventualAffineTraceResidue
  licence: Apache-2.0
  authors: ["benkeene"]
  summary: "The trace residue |H_λ \\ tr(H_λ)| of the shifted numerical semigroups H_λ = ⟨n + λw + r_i⟩ is eventually an affine function Aλ + B of λ, with A ≥ 0."
  description: >-
    For integers k ≥ 2, offsets 0 = r_0 < r_1 < ... < r_k = w with d = gcd(r_1, ..., r_k), and n > 0
    with gcd(n, d) = 1, let H_λ be the numerical semigroup generated by n + λw + r_i (0 ≤ i ≤ k). With
    PF(H) the pseudo-Frobenius numbers, tr(H) = {h ∈ H : ∃ p ∈ PF(H), ∀ f ∈ PF(H), h + p - f ∈ H} and
    res(H) = |H \ tr(H)|, the record states that there are integers A ≥ 0, B and L ≥ 0 with
    res(H_λ) = Aλ + B for every integer λ ≥ L (PROOF.md §7 Theorem).
toolchain: "leanprover/lean4:v4.35.0-rc3"
challenge_imports: [Mathlib]
permitted_axioms: [propext, Quot.sound, Classical.choice]
records:
  - name: EventualAffineTraceResidue.trace_residue_eventually_affine
    statement: >-
      Eventual affine trace residue (PROOF.md §7, Theorem; answers CLAIM.md affirmatively). Let k ≥ 2 and
      let r : Fin (k + 1) → ℤ be offsets 0 = r_0 < r_1 < ... < r_k = w (hypotheses `r 0 = 0`,
      `StrictMono r`, `r (Fin.last k) = w`). Let d = gcd(r_1, ..., r_k), written
      `Finset.univ.gcd fun i : Fin k => r i.succ` (the nonnegative gcd in ℤ), and let n > 0 be an integer
      with gcd(n, d) = 1. For an integer λ let H_λ = `shiftedSemigroup k r n w λ`, the submonoid of ℤ
      generated by n + λw + r_i for 0 ≤ i ≤ k. Then there are integers A ≥ 0, B and L ≥ 0 such that for
      every integer λ ≥ L the trace residue res(H_λ) = |H_λ \ tr(H_λ)| (`traceResidue`, an extended
      natural number) is a finite number N with N = Aλ + B.
    challenge_module: Challenge
    solution_module: Solution
    informal_ref: "PROOF.md §7 Theorem"
    kind: record
    signature: "(k : ℕ) (hk : 2 ≤ k) (r : Fin (k + 1) → ℤ) (w n : ℤ) (hr0 : r 0 = 0) (hr : StrictMono r) (hw : r (Fin.last k) = w) (hn : 0 < n) (hnd : Int.gcd n (Finset.univ.gcd fun i : Fin k => r i.succ) = 1) : ∃ A B L : ℤ, 0 ≤ A ∧ 0 ≤ L ∧ ∀ l : ℤ, L ≤ l → ∃ N : ℕ, traceResidue (shiftedSemigroup k r n w l : Set ℤ) = N ∧ (N : ℤ) = A * l + B"
